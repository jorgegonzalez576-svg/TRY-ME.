 const levels=mode==='fixed'?[levelFixed]:Array.from({length:levelTo-levelFrom+1},(_,i)=>levelFrom+i);
 const pool=catalogue.filter(c=>c.enabled!==false&&cardAllowed(c)&&hasItems(c)&&c.levels.some(v=>levels.includes(v))&&c.rooms.some(v=>places.includes(v)));
 const counts=[0,1].flatMap(actor=>['truth','dare'].map(type=>pool.filter(c=>c.type===type&&matchesPeople(c,actor)).length));
 let limit=0;
 for(let n=1;n<=30;n++){const demand=2*(2*Math.floor(n/3)+Math.min(n%3,2));if(counts.every(total=>total>=demand))limit=n;}
 return limit;
}

 const goalChoices=[10,15,20,30,40,50];
 function allowedGoals(){const limit=configuredCapacity();const max=7*Math.floor(limit/3)+3*(limit%3);return goalChoices.filter(value=>value<=max);}
 function fitGoal(){const choices=allowedGoals();if(choices.length&&!choices.includes(goal))goal=choices.filter(value=>value<=goal).pop()||choices[0];}
 function goalOptions(){return goalChoices.map(n=>`<option value="${n}" ${n===goal?'selected':''} ${allowedGoals().includes(n)?'':'disabled'}>${n}</option>`).join('');}

function enoughCards(){
 const place=route==='bedroomOnly'?'bedroom':'living',level=mode==='fixed'?levelFixed:levelFrom;
 const limit=configuredCapacity();
 const maximumScore=7*Math.floor(limit/3)+3*(limit%3);
 const places=route==='single'?['living']:route==='bedroomOnly'?['bedroom']:route==='journey3'?['living','kitchen','bedroom']:['living','bedroom'];
 const levels=mode==='fixed'?[levelFixed]:Array.from({length:levelTo-levelFrom+1},(_,i)=>levelFrom+i);
 const covered=(lev,loc)=>[0,1].every(actor=>['truth','dare'].every(type=>catalogue.some(c=>c.type===type&&eligible(c,lev,loc,actor,true))));
 const pathCovered=mode==='fixed'?places.every(loc=>covered(level,loc)):levels.every(lev=>places.some(loc=>covered(lev,loc)))&&covered(levelTo,places[places.length-1]);
 return limit>0&&maximumScore>=goal&&covered(level,place)&&pathCovered;
}
